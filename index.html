<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - Camilo Andrés Rodríguez Cifuentes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .content {
            padding: 40px 20px;
        }
        
        .section {
            margin-bottom: 40px;
        }
        
        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }
        
        .certificados-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .certificado-card {
            background: #f8f9fa;
            border: 2px solid #667eea;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .certificado-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.2);
            background: #f0f4ff;
        }
        
        .certificado-card img {
            width: 50px;
            height: 50px;
            margin-bottom: 15px;
        }
        
        .certificado-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        
        .certificado-card p {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 15px;
        }
        
        .btn-ver {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 0.95em;
        }
        
        .btn-ver:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #666;
            border-top: 1px solid #ddd;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        
        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📄 Mi CV</h1>
            <p>Camilo Andrés Rodríguez Cifuentes</p>
        </div>
        
        <div class="content">
            <div class="section">
                <h2>📜 Certificados</h2>
                <div class="certificados-grid">
                    <div class="certificado-card">
                        <div style="font-size: 2em; margin-bottom: 15px;">📋</div>
                        <h3>Certificado Ejemplo</h3>
                        <p>PDF de ejemplo - Click para ver</p>
                        <a href="CV/certificados/ejemplo.pdf" target="_blank" class="btn-ver">Ver PDF</a>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2026 Camilo Andrés Rodríguez Cifuentes | Repositorio: <a href="https://github.com/Camilo9495/CV_Camilo-Rodriguez-Cifuentes" style="color: #667eea; text-decoration: none;" target="_blank">GitHub</a></p>
        </div>
    </div>
</body>
</html>
